name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a PR cancels its run in progress. Pushes to main group by
# commit so every commit on main gets its own result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: [stable]
        include:
          # The minimum Go release, read from the go directive in go.mod
          # (DESIGN.md §3).
          - os: ubuntu-latest
            go: minimum
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go != 'minimum' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'minimum' && 'go.mod' || '' }}
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...

  lint:
    # Lint once per target OS so files behind build constraints
    # (*_windows.go, *_darwin.go) are checked too. `run` also checks the
    # formatters in .golangci.yml, so there's no separate fmt step.
    name: Lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
    env:
      GOOS: ${{ matrix.goos }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          # Keep in sync with the version developers run locally.
          version: v2.15.0

  tidy:
    name: Go mod tidy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Check go.mod and go.sum are tidy
        run: make tidy

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: govulncheck
        run: make vuln
