name: Release

# Builds and publishes the GitHub release for a tag with goreleaser
# (.goreleaser.yaml), with release notes from git-cliff (cliff.toml).
# Release Cut calls it after tagging; running it by hand rebuilds the
# release for an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Release ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # publish the release and upload its files
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' isn't a release tag like v1.2.3."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          # git-cliff and goreleaser both read history and tags.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          # Releases build with the newest Go, for its security fixes;
          # tools/go.mod may need a newer one than go.mod anyway.
          go-version: stable
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2

      - name: Release notes
        run: git cliff --current --strip all > "$RUNNER_TEMP/notes.md"

      - name: Build and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # go tool -n builds goreleaser from tools/go.mod and prints its
          # path, with the Go toolchain that module asks for.
          goreleaser=$(go -C tools tool -n goreleaser)
          "$goreleaser" release --clean --release-notes "$RUNNER_TEMP/notes.md"
