name: Release Cut

# Run by hand from the Actions tab (docs/CONTRIBUTING.md). It works out the
# next version from the commit types since the last tag, previews the
# release notes, and, unless it's a dry run, tags main and calls the
# release workflow. The call is direct because a tag pushed with the
# workflow's own token doesn't trigger other workflows.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto works it out from commit types)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: Only preview the version and release notes
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time, and never cancel one halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  cut:
    name: Cut ${{ inputs.dry_run && '(dry run)' || 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the tag
      actions: read # check CI passed on the commit
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run Release Cut from main, not $GITHUB_REF."
          exit 1

      - uses: actions/checkout@v7
        with:
          # git-cliff reads the whole history and every tag.
          fetch-depth: 0

      - name: Require CI to have passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json conclusion --jq '.[0].conclusion // "none"')
          if [[ "$conclusion" != success ]]; then
            echo "::error::CI on $GITHUB_SHA is '$conclusion', not success."
            exit 1
          fi

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2

      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          latest=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          next=$(git cliff --bumped-version --bump "$BUMP")
          if [[ -n "$latest" && "$next" == "$latest" ]]; then
            echo "::error::Nothing to release since $latest: no feat, fix, perf, refactor, docs or revert commits."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::Tag $next already exists."
            exit 1
          fi
          echo "Releasing $next (previous: ${latest:-none})"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Preview release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "## $TAG"
            echo
            git cliff --unreleased --tag "$TAG" --strip all
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

  release:
    needs: cut
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write # publish the release
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.cut.outputs.tag }}
