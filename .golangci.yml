# Linter set and rationale: docs/DESIGN.md §10.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # unclosed HTTP response bodies
    - errorlint # errors.Is/As and %w used correctly
    - exhaustive # switches cover every case of an enum-like type
    - gocritic
    - gosec # file permissions, zip-slip, etc.
    - misspell
    - nilerr
    - noctx # HTTP requests without a context
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G304 # file paths from variables; a file manager does this by design
  exclusions:
    rules:
      # Taint analysis flags tests writing fixtures to paths they built
      # themselves (t.TempDir, testdata/). Production code is still checked.
      - path: _test\.go
        linters: [gosec]
        text: G703

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/austinrr/knapsack
